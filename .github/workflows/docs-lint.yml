name: Docs Lint

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/docs-lint.sh'
      - '.github/workflows/docs-lint.yml'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/docs-lint.sh'
      - '.github/workflows/docs-lint.yml'
  workflow_dispatch:

jobs:
  required-sections:
    name: Topic files have required sections
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint topic files
        run: bash scripts/docs-lint.sh
